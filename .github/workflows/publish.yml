name: Publish to package managers

# Fans out from a single GitHub release to the package managers: npm,
# Homebrew tap, Scoop bucket, Winget (microsoft/winget-pkgs). Each job is
# independent, so one failure doesn't block the others, and each is
# re-runnable from the Actions tab.
#
# npm is here, rather than in release.yml where it started, so that it waits
# for the same human review as everything else. release.yml ran it before the
# draft existed. It is still the only workflow that publishes to npm.
#
# Triggers:
#   - On `release: published`. release.yml builds on the tag push and leaves
#     a DRAFT, so publishing that draft by hand is the normal path in and
#     the assets already exist by then.
#   - On `workflow_dispatch` with a tag input, which is how you re-run a
#     specific registry after a transient failure.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.6.0). Must already exist as a published release with assets attached.'
        required: true
        type: string

# Keyed on the tag, not the ref, because `workflow_dispatch` and
# `release: published` reach the same tag by different refs and would
# otherwise not see each other.
#
# `cancel-in-progress: false` deliberately. The jobs below push to
# registries the moment they succeed, so cancelling halfway leaves some
# registries on the new version and some on the old, with no record of
# which. Queueing costs a few idle minutes. The duplicate run is a no-op,
# since every publish script is idempotent for a tag it has already pushed.
concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# These jobs hold three publishing tokens between them (the tap, the bucket,
# winget) and none of them needs GITHUB_TOKEN to write to this repo. npm
# publishes through OIDC and has no token. Read is what the checkouts need. The
# npm job adds id-token for itself, and the npm, Homebrew, Scoop and Winget jobs
# add attestation read for verified_sha.
permissions:
  contents: read

# Resolve the tag once at the workflow level so every job sees the same
# version regardless of trigger.
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # Every job below sets `timeout-minutes`; GitHub's default is 360.
  #
  # A publish job can legitimately spend most of its life waiting for the
  # asset it needs. That happens on the `workflow_dispatch` path, where the
  # tag's release.yml run may still be waiting on CI before it builds
  # anything. `wait_for_asset` in scripts/release/lib.sh bounds the wait
  # itself at 30 polls of 30s, so 15 minutes, and then fails with a message
  # naming the URL that never appeared.
  #
  # That graceful failure is worth protecting. A job timeout below ~15
  # minutes would pre-empt it and replace a clear explanation with an opaque
  # cancellation, so 30 leaves the designed wait intact plus room to
  # download, re-hash and push, while still bounding a true hang.
  #
  # A timeout mid-publish is recoverable but not free. Each registry job is
  # independent and re-runnable, and the summary job reports which
  # registries actually landed. Publishing is not transactional across
  # registries either way. That is a property of the design, not something a
  # timeout introduces.

  # --- npm --------------------------------------------------------------
  # @fstubner/nvx and its five per-platform packages. The binaries are the
  # release's own assets, each checked against its sidecar and against the
  # build provenance release.yml attested, before anything is published.
  npm:
    name: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token for npm trusted publishing (OIDC) and provenance;
    # attestations to read release.yml's.
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # Trusted publishing needs npm 11.5.1 or newer, and the runner's
      # preinstalled npm can be older, so install a known version.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm 11.6.2
        run: npm install -g npm@11.6.2 && npm --version
      - name: Publish @fstubner/nvx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/publish-npm.sh "$TAG"

  # --- Homebrew tap -----------------------------------------------------
  # Writes Formula/nvx.rb in fstubner/homebrew-tap, which also holds
  # netscli's formula. One formula covers macOS arm64 and x86_64 plus Linux
  # amd64 and arm64, so this job verifies four assets.
  homebrew:
    name: Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # attestations, so verified_sha can check release.yml's build provenance.
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Update fstubner/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ATTESTATION_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/publish-homebrew.sh "$TAG"

  # --- Scoop bucket -----------------------------------------------------
  # Writes bucket/nvx.json in fstubner/scoop-bucket, which also holds
  # netscli's two manifests.
  scoop:
    name: Scoop bucket
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # attestations, so verified_sha can check release.yml's build provenance.
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Update fstubner/scoop-bucket
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          ATTESTATION_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release/publish-scoop.sh "$TAG"

  # --- Winget (microsoft/winget-pkgs) -----------------------------------
  # Writes a manifest folder from the release with Komac and opens a pull
  # request on microsoft/winget-pkgs from the token owner's fork. Moderator
  # approval lands it on the public catalog.
  #
  # nvx.exe is checked first, as in the other three jobs: against its sidecar
  # and against the build provenance release.yml attested (verified_sha). Komac
  # then downloads it once for itself, and the manifests it writes have to
  # carry the digest that was verified before anything is sent.
  # scripts/release/submit-winget.ps1 does that and says what else it does.
  #
  # The package has to be in winget-pkgs already. The first version is
  # submitted by hand (packaging/winget/README.md), and until it has merged
  # this job stops with that message.
  winget:
    name: Winget
    runs-on: windows-latest
    timeout-minutes: 30
    # attestations, so verified_sha can check release.yml's build provenance.
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      # verified_sha polls for the .sha256 sidecar for up to 15 minutes before it
      # gives up, which is what the `workflow_dispatch` path needs when the tag's
      # release.yml run is still building. The step that used to poll for it here
      # is not needed.
      #
      # GITHUB_TOKEN reads the attestation. WINGET_TOKEN stays out of this step.
      - name: Verify the Windows release asset
        id: verify
        shell: bash
        env:
          ATTESTATION_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          . scripts/release/lib.sh
          validate_tag "$TAG"
          sha=$(verified_sha "https://github.com/fstubner/nvx/releases/download/${TAG}" "nvx.exe")
          echo "-> nvx.exe sha256 ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # `--version` is the PackageVersion that lands in the catalog, and it
      # must not carry the tag's `v`. Passing the tag as it is would submit
      # `v0.6.1` beside an existing `0.6.0`. Winget sorts versions
      # naturally, so the two do not compare as an upgrade.
      - name: Resolve PackageVersion (tag without the leading v)
        id: pkg
        shell: bash
        env:
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Assert, do not just strip.
          #
          # netscli published five CLI versions carrying a leading `v` in
          # PackageVersion before this expression existed, because the tag
          # went through untouched and nothing downstream objected.
          # winget-pkgs accepted every one of them and a merged manifest is
          # permanent. Microsoft's validation does not enforce this, so it
          # has to be enforced here or not at all.
          #
          # Nothing else in this release is shaped like this, so a tag that
          # fails the check means the tag itself is wrong, not just this job.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::PackageVersion '${version}' (from tag '${TAG}') is not MAJOR.MINOR.PATCH." >&2
            echo "winget-pkgs will accept it anyway and it is permanent once merged." >&2
            exit 1
          fi
          echo "-> PackageVersion ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Komac, from one pinned release, checked against its SHA-256 before it
      # runs with WINGET_TOKEN.
      #
      # This was vedantmgoyal9/winget-releaser, pinned by commit. Its own
      # steps then ran cargo-bins/cargo-binstall from that project's main
      # branch and `cargo binstall komac` for whatever Komac was newest, so
      # the pin covered none of the code that held the token. The cleanup
      # below is one of the two komac commands that action ran, with the same
      # inputs. The digest is the one GitHub records for the asset, and it
      # matches the release's own SHA256SUMS.
      #
      # Komac downloads nvx.exe for itself and puts the hash of what it got in
      # the manifest, so the digest verified above does not reach winget-pkgs
      # unless the manifest carries it. submit-winget.ps1 has Komac write the
      # manifests to a folder with `update --dry-run`, fails unless they carry
      # the verified digest, and then sends that folder with `komac submit`.
      # Komac downloads the file once, and a file replaced after the check
      # cannot reach the pull request. This used to follow the dry run with
      # `update --submit`, which downloaded the file a second time and opened
      # the pull request before the manifest it sent could be checked.
      - name: Submit nvx to microsoft/winget-pkgs
        shell: pwsh
        env:
          KOMAC_VERSION: '2.16.0'
          KOMAC_SHA256: 'bdc45baf028f750da7519cc8a5f2eab5dfef46dfe88650eeb0d0a9bf51446e4f'
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
          TAG: ${{ env.TAG }}
          VERIFIED_SHA: ${{ steps.verify.outputs.sha }}
          KOMAC_FORK_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $komac = Join-Path $env:RUNNER_TEMP 'komac.exe'
          $komacUrl = "https://github.com/russellbanks/Komac/releases/download/v$($env:KOMAC_VERSION)/komac-$($env:KOMAC_VERSION)-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest -Uri $komacUrl -OutFile $komac -UseBasicParsing
          $actual = (Get-FileHash $komac -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:KOMAC_SHA256) {
            Write-Output "::error::komac $($env:KOMAC_VERSION) has SHA-256 $actual, expected $($env:KOMAC_SHA256). Not running it."
            exit 1
          }

          ./scripts/release/submit-winget.ps1 `
            -Komac $komac `
            -PackageIdentifier 'fstubner.nvx' `
            -PackageVersion $env:PACKAGE_VERSION `
            -InstallerUrl "https://github.com/fstubner/nvx/releases/download/$($env:TAG)/nvx.exe" `
            -ExpectedSha256 $env:VERIFIED_SHA `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP 'winget-manifests')
          # Deletes the fork's branches whose pull requests have merged.
          & $komac cleanup --only-merged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # --- Fan-out summary --------------------------------------------------
  #
  # The four jobs above are deliberately independent. Homebrew landing
  # while Winget fails is a normal, recoverable state, and each job re-runs
  # on its own. The cost of that independence is that "did this release
  # actually reach every registry?" can only be answered by opening four
  # job pages, and a single failure among two greens is easy to miss.
  #
  # This job REPORTS, it does not gate, and that is on purpose. Failing the
  # run on a partial publish would contradict the independence above and
  # make a red X mean "one registry needs a rerun", which is
  # indistinguishable at a glance from "the release is broken". The table
  # goes to the run summary and any incomplete registry gets a ::warning::.
  #
  # `needs` result values: success | failure | cancelled | skipped. The
  # check is an allowlist of the two good ones rather than a denylist of the
  # two bad ones, because a runner that never starts can report a state
  # matching neither.
  summary:
    name: Publish summary
    if: always()
    needs:
      - npm
      - homebrew
      - scoop
      - winget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report each registry's result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'

          {
            echo "### Publish fan-out for ${TAG}"
            echo ""
            echo "| Registry | Result |"
            echo "| --- | --- |"
            echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          incomplete=$(echo "$NEEDS" | jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped"))
            | map("\(.key)=\(.value.result)")
            | join(", ")
          ')

          if [[ -n "$incomplete" ]]; then
            echo "::warning::Publish incomplete for ${TAG}. These registries did not update: ${incomplete}"
            {
              echo ""
              echo "**${TAG} did not reach every registry.** Re-run the failed jobs from the"
              echo "Actions tab, or \`workflow_dispatch\` this workflow with tag \`${TAG}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All registries published for ${TAG}."
          fi
