name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [ '1.26.6' ]


    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify dependencies
      run: go mod verify

    - name: Build nvx
      run: go build -v ./...

    - name: Run unit tests
      run: go test -v -race ./...

    # These drive a real AppContainer launch end to end (piped stdio through a real
    # pipe, an unelevated package-manager run). They were written behind NVX_PROBE=1
    # because they mutate ACLs and create a throwaway profile. Running them here is
    # what turns "hosted runners cannot host an AppContainer" from an assumption into
    # a measurement -- if it is true, this step says so with a real error.
    - name: Windows AppContainer probes
      if: matrix.os == 'windows-latest'
      shell: pwsh
      env:
        NVX_PROBE: '1'
      # No -run filter. This was a hand-maintained list of names and it drifted
      # exactly as such a list does: 31 of the 41 probe-gated tests matched
      # nothing and ran nowhere, among them the ones that check a sandbox cannot
      # read another project, that a deny ACE hides a secret, that one session
      # cannot read another's files, and that the relay does not expose host
      # loopback services. Every one of those backs a claim in README or
      # SECURITY.md.
      #
      # NVX_PROBE=1 is itself the selector -- each probe checks it and skips
      # otherwise -- so setting it and running everything needs no list to keep
      # in step with the tests.
      #
      # NVX_PROBE_PROTOTYPES is deliberately NOT set. One feasibility prototype
      # sits behind it because it is flaky (~1 run in 8) and guards nothing that
      # ships; a pipeline that fails at random teaches people to re-run rather
      # than read it. That is a different thing from the hand-maintained -run
      # filter this replaced, which silently skipped real security probes.
      run: go test -v ./...

    - name: Windows sandbox smoke
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        go build -o nvx.exe .
        ./scripts/sandbox-smoke.ps1
        ./scripts/sandbox-smoke-egress.ps1

    # The unit-test step above already exercises Landlock, the syscall table and
    # reaping -- those need no privileges and pass on a hosted runner. The netns
    # egress test does not: it needs CAP_SYS_ADMIN for unshare and `ip` from
    # iproute2, so it skipped silently and the one path that proves a contained
    # process can reach the outside proxy went unverified.
    # install.sh shipped for months writing only `eval "$(nvx env)"` into the shell
    # profile, never putting nvx on PATH -- so every new shell printed
    # "nvx: command not found" and nvx never activated. Nothing tested the
    # installer, which is why it went unnoticed. Runs on macOS too: that is where
    # bash is a LOGIN shell and reads .bash_profile rather than .bashrc, the case
    # the profile-selection logic exists for.
    - name: Installer shell-profile test
      if: matrix.os != 'windows-latest'
      shell: bash
      run: sh scripts/test-install-profile.sh

    - name: Linux containment tests (privileged)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      # Bounded because this step hung for an hour on three of four runs around
      # 2026-08-19, consuming the whole job while the other platforms sat green.
      # A stalled apt mirror is not a product failure and should not look like one.
      timeout-minutes: 12
      run: |
        # iproute2 ships on the hosted runners; only reach for the network when it
        # genuinely is not there. `apt-get update` was the step that stalled.
        if ! command -v ip >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
        fi
        # -run selects only the namespace-gated tests; a skip here means the
        # environment still cannot host them, which is worth seeing in the log.
        sudo -E env "PATH=$PATH" go test -v -timeout 8m -run 'TestNetns|TestReap|TestSupervisorClone' . 2>&1 | tee /tmp/priv.log
        if grep -q '^--- SKIP' /tmp/priv.log; then
          echo "::warning::a privileged containment test skipped even under sudo; it is verifying nothing"
        fi

    - name: Linux sandbox smoke
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke.sh scripts/sandbox-smoke-egress.sh scripts/sandbox-enforcement-linux.sh
        ./scripts/sandbox-smoke.sh
        ./scripts/sandbox-smoke-egress.sh

    # The smoke scripts check that the sandbox runs and that blocked egress
    # fails. This one asserts the filesystem guarantees with absolute paths --
    # the smoke script's host-write check goes through the sandbox's own $HOME,
    # which is the redirected guest profile, so it passes whenever the redirect
    # works even if nothing is restricted.
    #
    # Run privileged, like the netns tests above and for the same reason: Ubuntu
    # 24.04 restricts unprivileged user namespaces, so nvx's Landlock launch is
    # refused and nvx fails closed rather than running uncontained. Unprivileged
    # the script skips with that explanation instead of failing, so it is still
    # usable on a developer machine.
    - name: Linux containment enforcement
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      timeout-minutes: 8
      run: |
        # Ubuntu 24.04 restricts what processes inside an unprivileged user
        # namespace may do, through AppArmor rather than through Landlock. nvx
        # creates NEWUSER|NEWNS, and exec of a perfectly allowlisted runtime was
        # refused with EACCES until this is relaxed. It is a property of the
        # distribution's default hardening, not of nvx, and an ephemeral runner
        # is the right place to turn it off; a real user on 24.04 would hit the
        # same wall, which is worth knowing separately.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
        # Unprivileged, now that the sysctl above allows unprivileged user
        # namespaces. Running it under sudo was the previous attempt and it kept
        # failing: nvx enters NEWUSER, and files created by root are not
        # accessible to a process in a user namespace that does not map root, so
        # exec of the runtime was refused with EACCES while Landlock was granting
        # it correctly. Unprivileged is also the configuration nvx is built for.
        ./scripts/sandbox-enforcement-linux.sh

    # The smoke script checks a sandboxed process can write its own working
    # directory, which would pass against a sandbox that blocks nothing. The
    # enforcement script is the one that can fail: it asserts what must be
    # DENIED, what must still be ALLOWED, and the documented read weakness, so
    # macOS stops being the platform whose claims rest on reading the generator.
    - name: macOS sandbox smoke
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke-macos.sh scripts/sandbox-enforcement-macos.sh
        ./scripts/sandbox-smoke-macos.sh

    - name: macOS containment enforcement
      if: matrix.os == 'macos-latest'
      shell: bash
      run: ./scripts/sandbox-enforcement-macos.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'
        cache: false

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1

    - name: Run gosec
      uses: securego/gosec@master
      with:
        args: -severity=high -confidence=high -exclude=G204,G304,G301,G306,G702,G703,G704 ./...

