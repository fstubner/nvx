# The same gate netscli runs on its site/ directory, with this repo as the
# site root. Every step blocks; a check that is allowed to fail is a check
# nobody reads.
#
# It runs on a GitHub-hosted runner. This was self-hosted until 2026-09-12,
# to avoid metered minutes on a private repo, and the trade turned out badly:
# the runner went offline and every queued run sat there indefinitely,
# reporting neither pass nor fail. A check that cannot run is worse than a
# metered one, because nothing about it looks broken -- the pull request just
# waits.
#
# Hosted runners also remove the security condition the self-hosted setup
# carried, which was that a fork's pull request would have executed its own
# code on a personal machine the moment this repo was made public.
#
# Still one job rather than two: two would checkout and `npm ci` twice for no
# gain. The step names report separately either way.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Checks
    runs-on: ubuntu-latest
    # The browser sweeps are the slow part, at a couple of minutes each. This
    # is a ceiling on a hang rather than a target; a hosted runner is torn
    # down afterwards, so an overrun costs minutes and nothing else.
    timeout-minutes: 30
    defaults:
      run:
        # Explicit, so these are the same commands that work locally. It is
        # already the default on Linux; naming it keeps that true if the
        # runner image ever changes.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # check:changelog compares dated headings against tags; with the
          # default depth there are none and a dated-but-untagged version
          # cannot be caught.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # On now, and the reason is the runner. This was off while CI was
          # self-hosted, where ~/.npm already sat on the disk between runs and
          # caching turned a local read into an upload and a download -- the
          # first run measured the checks finishing in under four minutes with
          # the cache upload still going ten minutes later. A hosted VM is
          # thrown away after every run, so there is no local cache to prefer
          # and this is the case the option was written for.
          cache: npm
      - run: npm ci

      # --- Static guards: no build needed ---------------------------------
      # 300 lines per file, with named transition exceptions.
      - name: File size guard
        run: node scripts/check-file-size.mjs
      # A declaration a later file always overrides is dead; budget 0.
      - name: Dead CSS budget
        run: npm run check:css
      # One region file per part of the docs shell, all registered, no
      # !important outside the named exceptions.
      - name: CSS region guard
        run: npm run check:regions
      # The wordmark's transparent margin still matches the token that
      # cancels it.
      - name: Wordmark inset
        run: npm run check:wordmark

      # --- The build, and the checks that read dist/ ----------------------
      - name: Build
        run: npm run build
      - name: Types
        run: npm run check
      - name: Changelog dates
        run: npm run check:changelog
      - name: Accessibility check
        run: npm run test:a11y
      - name: Rendered contrast sweep
        run: npm run check:contrast

      # There was a cleanup step here that killed a leftover `astro preview`
      # between runs. It existed because a cancelled sweep left one holding
      # its port on the self-hosted runner, failing the NEXT run on a port
      # conflict rather than on anything real. A hosted runner is destroyed
      # after the job, so nothing survives to conflict with.
