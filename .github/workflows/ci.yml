name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [ '1.26.4' ]


    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify dependencies
      run: go mod verify

    - name: Build nvx
      run: go build -v ./...

    - name: Run unit tests
      run: go test -v -race ./...

    # These drive a real AppContainer launch end to end (piped stdio through a real
    # pipe, an unelevated package-manager run). They were written behind NVX_PROBE=1
    # because they mutate ACLs and create a throwaway profile. Running them here is
    # what turns "hosted runners cannot host an AppContainer" from an assumption into
    # a measurement -- if it is true, this step says so with a real error.
    - name: Windows AppContainer probes
      if: matrix.os == 'windows-latest'
      shell: pwsh
      env:
        NVX_PROBE: '1'
      run: go test -v -run 'TestPipedStdio|TestAppContainer|TestUnelevatedSandbox' .

    - name: Windows sandbox smoke
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        go build -o nvx.exe .
        ./scripts/sandbox-smoke.ps1
        ./scripts/sandbox-smoke-egress.ps1

    # The unit-test step above already exercises Landlock, the syscall table and
    # reaping -- those need no privileges and pass on a hosted runner. The netns
    # egress test does not: it needs CAP_SYS_ADMIN for unshare and `ip` from
    # iproute2, so it skipped silently and the one path that proves a contained
    # process can reach the outside proxy went unverified.
    - name: Linux containment tests (privileged)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq iproute2
        # -run selects only the namespace-gated tests; a skip here means the
        # environment still cannot host them, which is worth seeing in the log.
        sudo -E env "PATH=$PATH" go test -v -run 'TestNetns|TestReap|TestSupervisorClone' . 2>&1 | tee /tmp/priv.log
        if grep -q '^--- SKIP' /tmp/priv.log; then
          echo "::warning::a privileged containment test skipped even under sudo; it is verifying nothing"
        fi

    - name: Linux sandbox smoke
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke.sh scripts/sandbox-smoke-egress.sh
        ./scripts/sandbox-smoke.sh
        ./scripts/sandbox-smoke-egress.sh

    - name: macOS sandbox smoke
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke-macos.sh
        ./scripts/sandbox-smoke-macos.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.4'
        cache: false

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1

    - name: Run gosec
      uses: securego/gosec@master
      with:
        args: -severity=high -confidence=high -exclude=G204,G304,G301,G306,G702,G703,G704 ./...

