name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [ '1.26.6' ]


    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # 24, not 20, because scripts/sandbox-smoke-egress.ps1 needs
        # --use-env-proxy to exist: Node core ignores HTTP_PROXY without it, so on
        # an older runtime the allowlisted half of that check can never pass and
        # the script skipped itself before reaching anything about nvx. It now
        # skips on the real blocker instead -- hosted Windows runners refusing to
        # create AppContainer children -- which is the difference between a
        # misleading reason and a true one. Node 20 is also deprecated on the
        # runners.
        node-version: '24'

    - name: Verify dependencies
      run: go mod verify

    # On Linux only: the checkout there has LF endings, so gofmt's answer is
    # about the committed bytes. A Windows checkout under core.autocrlf=true
    # has CRLF in the working tree and gofmt flags all 271 files, which is why
    # `gofmt -l` has never been usable as a local signal here and why this gate
    # did not exist. Four files were unformatted in the committed bytes when it
    # was added, and .gitattributes had been asserting they were clean.
    #
    # `go vet` for all three platforms in one place, because `go build` does not
    # compile test files: a helper defined in a _windows_test.go file and used
    # from an untagged one passed three GOOS build checks and broke the macOS
    # unit job on push.
    - name: Format and vet
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt would change these files; run gofmt -w on them"
          echo "$unformatted"
          exit 1
        fi
        GOOS=linux go vet ./...
        GOOS=darwin go vet ./...
        GOOS=windows go vet ./...

    - name: Build nvx
      run: go build -v ./...

    - name: Run unit tests
      run: go test -v -race ./...

    # These drive a real AppContainer launch end to end (piped stdio through a real
    # pipe, an unelevated package-manager run). They were written behind NVX_PROBE=1
    # because they mutate ACLs and create a throwaway profile. Running them here is
    # what turns "hosted runners cannot host an AppContainer" from an assumption into
    # a measurement -- if it is true, this step says so with a real error.
    - name: Windows AppContainer probes
      if: matrix.os == 'windows-latest'
      shell: pwsh
      env:
        NVX_PROBE: '1'
      # No -run filter. This was a hand-maintained list of names and it drifted
      # exactly as such a list does: 31 of the 41 probe-gated tests matched
      # nothing and ran nowhere, among them the ones that check a sandbox cannot
      # read another project, that a deny ACE hides a secret, that one session
      # cannot read another's files, and that the relay does not expose host
      # loopback services. Every one of those backs a claim in README or
      # SECURITY.md.
      #
      # NVX_PROBE=1 is itself the selector -- each probe checks it and skips
      # otherwise -- so setting it and running everything needs no list to keep
      # in step with the tests.
      #
      # NVX_PROBE_PROTOTYPES is deliberately NOT set. One feasibility prototype
      # sits behind it because it is flaky (~1 run in 8) and guards nothing that
      # ships; a pipeline that fails at random teaches people to re-run rather
      # than read it. That is a different thing from the hand-maintained -run
      # filter this replaced, which silently skipped real security probes.
      #
      # The counts are printed at the end, and that is the point of the tee.
      # docs/enforcement-matrix.md used to quote "442 pass and 35 skip" from a
      # run someone had read by hand; it drifted, and an acceptance pass could
      # not check it from a developer machine because this host runs the probes
      # rather than skipping them. A number nobody can reproduce is a number that
      # rots quietly. Now every run states its own, in one greppable line, and
      # the doc cites where to look instead of embedding a figure.
      #
      # PASS/SKIP/FAIL here are TOP-LEVEL tests. `go test -v` also prints
      # subtest lines, which is why a hand count and this one disagree.
      #
      # -race, because without it nothing in this project ever ran the probe
      # tests under the detector: the unit step above runs -race but not
      # NVX_PROBE, this step ran NVX_PROBE but not -race, and CONTRIBUTING's
      # manual gate matched this step. A probe test could therefore hold a data
      # race indefinitely, and one did -- a strings.Builder shared between
      # os/exec's copier goroutines and a poll loop, found only when an
      # acceptance pass combined the two flags by hand.
      run: |
        # A staged runtime and a GLOBAL DEFAULT, before the probes run.
        #
        # Several probes resolve npm/node through nvx and skip when neither an
        # active shell version nor a global default is set -- and `nvx use` sets
        # only the former, so the natural setup leaves them skipping with a
        # message that says just "run `nvx install`". Among them are both probes
        # backing the most-corrected claim in this project, that contained npx
        # works without an elevated setup. Measured 2026-09-03: a plain probe run
        # skipped 45 tests; the same run with a runtime installed and defaulted
        # skipped 7 and passed 491.
        go build -o nvx.exe .
        $env:NVX_HOME = Join-Path $env:RUNNER_TEMP 'nvxprobehome'
        New-Item -ItemType Directory -Force -Path $env:NVX_HOME | Out-Null
        ./nvx.exe -y install 22
        ./nvx.exe -y default 22

        go test -v -race ./... 2>&1 | Tee-Object -FilePath probe.log
        $code = $LASTEXITCODE
        $pass = (Select-String -Path probe.log -Pattern '^--- PASS' ).Count
        $skip = (Select-String -Path probe.log -Pattern '^--- SKIP' ).Count
        $fail = (Select-String -Path probe.log -Pattern '^--- FAIL' ).Count
        $line = "NVX_PROBE_COUNTS pass=$pass skip=$skip fail=$fail"
        Write-Host $line
        "$line" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

        $reasons = Select-String -Path probe.log -Pattern '^--- SKIP' -Context 2,0 |
          ForEach-Object { $_.Context.PreContext[-1] } | Sort-Object -Unique
        Write-Host "--- skip reasons ---"
        $reasons | ForEach-Object { Write-Host $_ }

        # Linux fails outright when a privileged containment test skips, because
        # there the environment can be fixed (a sysctl) and a skip means a real
        # hole. Windows cannot: hosted runners refuse to create AppContainer
        # children, so that one skip is a standing fact about the runner, not a
        # regression. Every OTHER skip reason is a regression -- a probe that
        # stopped running because a premise check fired, a runtime went missing,
        # or someone added a gate nobody reads. Those used to be invisible: the
        # step exited on go test's code, and a skip is exit 0.
        #
        # So: an allowlist of reasons known to be environmental, and a failure
        # for anything else. Adding a line here is a deliberate act with a
        # reviewer attached, which is the property the old `-run` filter lacked.
        $allowed = @(
          'cannot create AppContainer children',
          'creating symlinks on Windows needs privilege or Developer Mode',
          'child-side helper for',
          'internal child for the launch timing probe',
          'not a -race build',
          'no nvx loopback exemption',
          'NVX_PROBE_PROTOTYPES=1 to run',
          'cannot grant the container access to cmd.exe'
        )
        $unexpected = $reasons | Where-Object {
          $r = $_; -not ($allowed | Where-Object { $r -match [regex]::Escape($_) })
        }
        if ($unexpected) {
          Write-Host "::error::a containment probe skipped for a reason that is not a known host limitation; it is verifying nothing"
          $unexpected | ForEach-Object { Write-Host "::error::$_" }
          exit 1
        }
        exit $code

    - name: Windows sandbox smoke
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        go build -o nvx.exe .
        ./scripts/sandbox-smoke.ps1
        ./scripts/sandbox-smoke-egress.ps1

    # The Windows counterpart of the Linux and macOS enforcement steps. It will
    # skip here: hosted Windows runners refuse to create AppContainer children,
    # CreateProcess returning "Access is denied" for every executable including
    # cmd.exe. The step exists so that stops being a standing assumption -- if a
    # future runner image can host one, this starts asserting on its own rather
    # than waiting for someone to notice.
    #
    # Until then Windows enforcement is gated by hand before a release
    # (CONTRIBUTING.md), which is what the word "measured" in the Windows column
    # of docs/enforcement-matrix.md refers to.
    - name: Windows containment enforcement
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: ./scripts/sandbox-enforcement-windows.ps1

    # The unit-test step above already exercises Landlock, the syscall table and
    # reaping -- those need no privileges and pass on a hosted runner. The netns
    # egress test does not: it needs CAP_SYS_ADMIN for unshare and `ip` from
    # iproute2, so it skipped silently and the one path that proves a contained
    # process can reach the outside proxy went unverified.
    # install.sh shipped for months writing only `eval "$(nvx env)"` into the shell
    # profile, never putting nvx on PATH -- so every new shell printed
    # "nvx: command not found" and nvx never activated. Nothing tested the
    # installer, which is why it went unnoticed. Runs on macOS too: that is where
    # bash is a LOGIN shell and reads .bash_profile rather than .bashrc, the case
    # the profile-selection logic exists for.
    - name: Installer shell-profile test
      if: matrix.os != 'windows-latest'
      shell: bash
      run: sh scripts/test-install-profile.sh

    - name: Linux containment tests (privileged)
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      # Bounded because this step hung for an hour on three of four runs around
      # 2026-08-19, consuming the whole job while the other platforms sat green.
      # A stalled apt mirror is not a product failure and should not look like one.
      timeout-minutes: 12
      run: |
        # iproute2 ships on the hosted runners; only reach for the network when it
        # genuinely is not there. `apt-get update` was the step that stalled.
        if ! command -v ip >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2
        fi
        # -run selects only the namespace-gated tests; a skip here means the
        # environment still cannot host them, which is worth seeing in the log.
        sudo -E env "PATH=$PATH" go test -v -timeout 8m -run 'TestNetns|TestReap|TestSupervisorClone' . 2>&1 | tee /tmp/priv.log
        # A failure, not a warning. This said "it is verifying nothing" and then
        # let the job go green, so the condition it names could persist
        # indefinitely -- which is what happened on Linux before 2026-08-23, when
        # three checks skipped on every machine including this runner and reported
        # success for months. A step that describes a hole and does not act on it
        # is a slower version of not checking.
        if grep -q '^--- SKIP' /tmp/priv.log; then
          echo "::error::a privileged containment test skipped even under sudo; it is verifying nothing"
          grep -B3 '^--- SKIP' /tmp/priv.log || true
          exit 1
        fi

    - name: Linux sandbox smoke
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke.sh scripts/sandbox-smoke-egress.sh scripts/sandbox-enforcement-linux.sh
        # Same reason as the enforcement step below: Ubuntu 24.04's AppArmor
        # hardening lets an unprivileged user namespace be created but refuses
        # CAP_NET_ADMIN inside it, so nvx's loopback setup gets EPERM and the
        # sandbox fails closed. Without this both scripts skip themselves, which
        # is honest but verifies nothing.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
        ./scripts/sandbox-smoke.sh
        ./scripts/sandbox-smoke-egress.sh

    # The smoke scripts check that the sandbox runs and that blocked egress
    # fails. This one asserts the filesystem guarantees with absolute paths --
    # the smoke script's host-write check goes through the sandbox's own $HOME,
    # which is the redirected guest profile, so it passes whenever the redirect
    # works even if nothing is restricted.
    #
    # Run privileged, like the netns tests above and for the same reason: Ubuntu
    # 24.04 restricts unprivileged user namespaces, so nvx's Landlock launch is
    # refused and nvx fails closed rather than running uncontained. Unprivileged
    # the script skips with that explanation instead of failing, so it is still
    # usable on a developer machine.
    - name: Linux containment enforcement
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      timeout-minutes: 8
      run: |
        # Ubuntu 24.04 refuses unprivileged user-namespace creation by default,
        # through AppArmor rather than through Landlock. nvx's supervisor is
        # cloned with CLONE_NEWUSER, so without this it cannot start at all and
        # fails closed. That is the distribution's hardening, not an nvx bug, and
        # an ephemeral runner is the right place to relax it; a real user on 24.04
        # meets the same wall, which is worth knowing separately.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
        # Unprivileged on purpose: it is the configuration nvx is built for, and
        # the sysctl above is what makes it possible here. Earlier revisions of
        # this step blamed both AppArmor and root-owned files for the runtime
        # failing to exec. Neither was it -- the target was asking for a second,
        # nested user namespace, and the uid/gid mapping that goes with one is
        # written through /proc, which the supervisor's own Landlock ruleset does
        # not grant. See applyLinuxNamespaces.
        ./scripts/sandbox-enforcement-linux.sh

    # The smoke script checks a sandboxed process can write its own working
    # directory, which would pass against a sandbox that blocks nothing. The
    # enforcement script is the one that can fail: it asserts what must be
    # DENIED, what must still be ALLOWED, and the documented read weakness, so
    # macOS stops being the platform whose claims rest on reading the generator.
    - name: macOS sandbox smoke
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke-macos.sh scripts/sandbox-enforcement-macos.sh
        ./scripts/sandbox-smoke-macos.sh

    - name: macOS containment enforcement
      if: matrix.os == 'macos-latest'
      shell: bash
      run: ./scripts/sandbox-enforcement-macos.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'
        cache: false

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1

    - name: Run gosec
      uses: securego/gosec@master
      with:
        args: -severity=high -confidence=high -exclude=G204,G304,G301,G306,G702,G703,G704 ./...

