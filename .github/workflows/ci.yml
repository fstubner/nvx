name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  maintainability:
    name: File size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/check-file-size.mjs

  build:
    name: Build + typecheck
    needs: maintainability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Typecheck (non-blocking)
        # ~43 pre-existing type errors carried over from the source
        # extraction (untyped DOM access in landing-page.ts under a strict
        # tsconfig) — see README's "Known gaps". Surfaced but not gating
        # until cleaned up.
        run: npm run check
        continue-on-error: true
      - name: Accessibility check
        run: npm run test:a11y
