name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [ '1.26.4' ]


    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify dependencies
      run: go mod verify

    - name: Build nvx
      run: go build -v ./...

    - name: Run unit tests
      run: go test -v -race ./...

    - name: Windows sandbox smoke
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        go build -o nvx.exe .
        ./scripts/sandbox-smoke.ps1
        ./scripts/sandbox-smoke-egress.ps1

    - name: Linux sandbox smoke
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke.sh scripts/sandbox-smoke-egress.sh
        ./scripts/sandbox-smoke.sh
        ./scripts/sandbox-smoke-egress.sh

    - name: macOS sandbox smoke
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        go build -o nvx .
        chmod +x scripts/sandbox-smoke-macos.sh
        ./scripts/sandbox-smoke-macos.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.4'
        cache: false

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1

    - name: Run gosec
      uses: securego/gosec@master
      with:
        args: -severity=high -confidence=high -exclude=G204,G304,G301,G306,G702,G703,G704 ./...

