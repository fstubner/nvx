name: Release

on:
  push:
    tags:
      - 'v*'
  # A dry run: builds, signs and verifies nvx.exe, and stops before the
  # attestation and the draft. For checking the signing credentials without
  # cutting a release.
  workflow_dispatch:

# Each job asks for what it needs. The signing job holds the Certum
# credentials and runs a third-party signing tool, so it gets neither write
# access to the release nor the OIDC token the attestations are made with.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Verify dependencies
        run: go mod verify

      # This job runs on the tag and only tests on Ubuntu, so on its own it can
      # publish a draft built from a commit whose Windows or macOS job later
      # fails -- and did: the draft for v0.5.5 was complete while that commit's CI
      # run was still in progress. A human still gates publication, npm
      # included since it moved to publish.yml, so nothing broken can reach
      # users this way, but "the draft exists" should not be weaker evidence
      # than "CI passed".
      #
      # Waiting rather than duplicating the matrix: re-running three platforms
      # here would double every release's cost to re-answer a question CI has
      # already answered for the same SHA.
      #
      # Written with `gh` rather than a third-party wait action on purpose. This
      # is the release pipeline of a supply-chain security tool; adding someone
      # else's code to the job that signs and publishes its binaries, to save
      # twenty lines of polling, is the trade this project exists to argue
      # against.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          for _ in $(seq 60); do   # 60 x 20s = 20 minutes
            runs=$(gh run list --workflow=ci.yml --commit "$sha" \
                     --json status,conclusion --jq '.[]' || echo '')
            if [ -z "$runs" ]; then
              echo "No CI run for $sha yet; waiting."
            elif echo "$runs" | jq -e 'select(.status != "completed")' >/dev/null 2>&1; then
              echo "CI still running for $sha."
            elif echo "$runs" | jq -e 'select(.conclusion != "success")' >/dev/null 2>&1; then
              echo "::error::CI did not pass for $sha; refusing to build a release from it."
              gh run list --workflow=ci.yml --commit "$sha"
              exit 1
            else
              echo "CI passed for $sha."
              exit 0
            fi
            sleep 20
          done
          echo "::error::timed out waiting for CI on $sha"
          exit 1

      - name: Run tests
        run: go test -race ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # target triples -> published asset name (must match install.sh / install.ps1)
          build() {
            local goos="$1" goarch="$2" outname="$3"
            echo "Building ${outname} (${goos}/${goarch})"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/fstubner/nvx/internal/nvx.appVersion=${version}" \
              -o "dist/${outname}" ./cmd/nvx
          }

          build linux  amd64 nvx-linux-amd64
          build linux  arm64 nvx-linux-arm64
          build darwin amd64 nvx-darwin-amd64
          build darwin arm64 nvx-darwin-arm64
          build windows amd64 nvx.exe

      # Separate artifacts, so the signing job receives nvx.exe and nothing
      # else: the tool it runs never has the other binaries in reach.
      - name: Hand over the unsigned Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows
          path: dist/nvx.exe
          retention-days: 1
          if-no-files-found: error

      - name: Hand over the other binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            dist/nvx-linux-amd64
            dist/nvx-linux-arm64
            dist/nvx-darwin-amd64
            dist/nvx-darwin-arm64
          retention-days: 1
          if-no-files-found: error

  # Authenticode, so Windows names the publisher instead of warning about an
  # unknown one. It has to happen before anything is computed over nvx.exe:
  # signing rewrites the file, and a checksum or attestation of the unsigned
  # bytes would describe a file nobody downloads.
  #
  # The credentials live in the release-signing environment. The Certum
  # certificate is the one netscli signs with.
  sign-windows:
    name: Sign nvx.exe
    needs: build
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install osslsigncode
        run: |
          sudo apt-get update || true
          sudo apt-get install -y osslsigncode

      - name: Collect the unsigned binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: unsigned-windows
          path: ${{ runner.temp }}/win

      - name: Authenticode sign
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: bash scripts/release/sign-windows.sh "${RUNNER_TEMP}/win"

      - name: Hand over the signed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-windows
          path: ${{ runner.temp }}/win/nvx.exe
          retention-days: 1
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: [build, sign-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release and upload assets
      id-token: write        # build provenance attestation
      attestations: write    # build provenance attestation
    steps:
      - name: Collect the binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: binaries
          path: dist

      - name: Collect the signed Windows binary
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: signed-windows
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          # Per-asset checksum siblings (<hash>  <name>) + a combined manifest.
          cd dist
          : > SHASUMS256.txt
          for f in nvx-linux-amd64 nvx-linux-arm64 nvx-darwin-amd64 nvx-darwin-arm64 nvx.exe; do
            sha256sum "$f" | tee -a SHASUMS256.txt > "${f}.sha256"
          done
          echo "--- SHASUMS256.txt ---"
          cat SHASUMS256.txt

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/nvx-linux-amd64
            dist/nvx-linux-arm64
            dist/nvx-darwin-amd64
            dist/nvx-darwin-arm64
            dist/nvx.exe

      # An SBOM because procurement asks for one, and because for this project
      # the answer is the interesting part: go.mod declares no third-party
      # requirements and go.sum is empty, so the document lists the Go standard
      # library and nothing else. A reviewer can check that claim rather than
      # take the README's word for it.
      #
      # Generated from the built binaries rather than from the source tree, so
      # it describes what actually shipped. syft reads the module graph Go
      # embeds in the binary, which a source scan cannot confirm was the graph
      # used.
      #
      # These two are pinned by commit SHA rather than by tag, unlike the older
      # steps around them. A tag can be moved; these actions handle release
      # artifacts, and a security tool should not let a third party silently
      # change what runs over its own binaries. The existing steps are left
      # alone rather than converted here, which is a separate change.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/
          format: spdx-json
          output-file: dist/nvx.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM against the binaries
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/nvx-linux-amd64
            dist/nvx-linux-arm64
            dist/nvx-darwin-amd64
            dist/nvx-darwin-arm64
            dist/nvx.exe
          sbom-path: dist/nvx.spdx.json

      # npm is published from publish.yml, on `release: published`, not here.
      # This job leaves a draft for review, and publishing to npm from here
      # would put each version on the registry before anyone had looked at the
      # draft. scripts/release/publish-npm.sh fetches these same binaries from
      # the release and checks them against the provenance attested above.

      # Pinned by commit SHA for the reason given above the SBOM steps: this
      # action runs with contents: write over the release assets.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/nvx-linux-amd64
            dist/nvx-linux-amd64.sha256
            dist/nvx-linux-arm64
            dist/nvx-linux-arm64.sha256
            dist/nvx-darwin-amd64
            dist/nvx-darwin-amd64.sha256
            dist/nvx-darwin-arm64
            dist/nvx-darwin-arm64.sha256
            dist/nvx.exe
            dist/nvx.exe.sha256
            dist/SHASUMS256.txt
            dist/nvx.spdx.json
