name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # create the GitHub Release and upload assets
  id-token: write        # build provenance attestation
  attestations: write    # build provenance attestation

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Verify dependencies
        run: go mod verify

      # This job runs on the tag and only tests on Ubuntu, so on its own it can
      # publish a draft built from a commit whose Windows or macOS job later
      # fails -- and did: the draft for v0.5.5 was complete while that commit's CI
      # run was still in progress. A human still gates publication, so nothing
      # broken can reach users this way, but "the draft exists" should not be
      # weaker evidence than "CI passed".
      #
      # Waiting rather than duplicating the matrix: re-running three platforms
      # here would double every release's cost to re-answer a question CI has
      # already answered for the same SHA.
      #
      # Written with `gh` rather than a third-party wait action on purpose. This
      # is the release pipeline of a supply-chain security tool; adding someone
      # else's code to the job that signs and publishes its binaries, to save
      # twenty lines of polling, is the trade this project exists to argue
      # against.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          for _ in $(seq 60); do   # 60 x 20s = 20 minutes
            runs=$(gh run list --workflow=ci.yml --commit "$sha" \
                     --json status,conclusion --jq '.[]' || echo '')
            if [ -z "$runs" ]; then
              echo "No CI run for $sha yet; waiting."
            elif echo "$runs" | jq -e 'select(.status != "completed")' >/dev/null 2>&1; then
              echo "CI still running for $sha."
            elif echo "$runs" | jq -e 'select(.conclusion != "success")' >/dev/null 2>&1; then
              echo "::error::CI did not pass for $sha; refusing to build a release from it."
              gh run list --workflow=ci.yml --commit "$sha"
              exit 1
            else
              echo "CI passed for $sha."
              exit 0
            fi
            sleep 20
          done
          echo "::error::timed out waiting for CI on $sha"
          exit 1

      - name: Run tests
        run: go test -race ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          # target triples -> published asset name (must match install.sh / install.ps1)
          build() {
            local goos="$1" goarch="$2" outname="$3"
            echo "Building ${outname} (${goos}/${goarch})"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.appVersion=${version}" \
              -o "dist/${outname}" .
          }

          build linux  amd64 nvx-linux-amd64
          build linux  arm64 nvx-linux-arm64
          build darwin amd64 nvx-darwin-amd64
          build darwin arm64 nvx-darwin-arm64
          build windows amd64 nvx.exe

          # Per-asset checksum siblings (<hash>  <name>) + a combined manifest.
          cd dist
          : > SHASUMS256.txt
          for f in nvx-linux-amd64 nvx-linux-arm64 nvx-darwin-amd64 nvx-darwin-arm64 nvx.exe; do
            sha256sum "$f" | tee -a SHASUMS256.txt > "${f}.sha256"
          done
          echo "--- SHASUMS256.txt ---"
          cat SHASUMS256.txt

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/nvx-linux-amd64
            dist/nvx-linux-arm64
            dist/nvx-darwin-amd64
            dist/nvx-darwin-arm64
            dist/nvx.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/nvx-linux-amd64
            dist/nvx-linux-amd64.sha256
            dist/nvx-linux-arm64
            dist/nvx-linux-arm64.sha256
            dist/nvx-darwin-amd64
            dist/nvx-darwin-amd64.sha256
            dist/nvx-darwin-arm64
            dist/nvx-darwin-arm64.sha256
            dist/nvx.exe
            dist/nvx.exe.sha256
            dist/SHASUMS256.txt
