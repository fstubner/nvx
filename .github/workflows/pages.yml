# Builds site/ and deploys it to GitHub Pages at nvx.run.
#
# Manual trigger ONLY (workflow_dispatch). It started that way because the
# site carried the template's sample content. The copy is nvx's own now, so
# a push trigger is a choice about deploying on every merge to main. It would
# look like this:
#
#   push:
#     branches: [main]
#     paths: ['site/**', 'CHANGELOG.md', 'install.sh', 'install.ps1']
#
# CHANGELOG.md belongs in that list because the changelog page imports the
# repository root's copy. The install scripts belong in it because the
# prebuild copies them into the site (scripts/copy-install-scripts.mjs).
#
# Prerequisite, once: repository Settings -> Pages -> Source = "GitHub Actions"
# (not "Deploy from a branch"). This workflow expects that mode, and the custom
# domain is served from site/public/CNAME.
name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The changelog page reads dated headings and the check compares them
          # against tags; the default shallow clone has none.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: site/.nvmrc
      - run: npm ci
      - run: npm run build
      # The same check as site-ci.yml. Pagefind can fail inside a build that
      # still exits 0, and the site would then deploy a search box that finds
      # nothing.
      - name: Search index
        run: |
          if [ ! -f dist/pagefind/pagefind.js ]; then
            echo "::error::the build produced no search index (dist/pagefind/pagefind.js is missing)"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
