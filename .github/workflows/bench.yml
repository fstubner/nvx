name: Bench (manual)

on:
  workflow_dispatch:

jobs:
  bench:
    name: Shim overhead
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Build nvx
        run: go build -trimpath -ldflags "-s -w" -o nvx ./cmd/nvx

      - name: Benchmark shim dispatch overhead
        run: python3 scripts/bench.py --nvx ./nvx --runs 60
