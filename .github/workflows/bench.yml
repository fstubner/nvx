name: Bench (manual)

on:
  workflow_dispatch:

jobs:
  bench:
    name: Shim overhead
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build nvx
        run: go build -trimpath -ldflags "-s -w" -o nvx .

      - name: Benchmark shim dispatch overhead
        run: python3 scripts/bench.py --nvx ./nvx --runs 60
