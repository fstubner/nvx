name: Bench (manual)

on:
  workflow_dispatch:

jobs:
  bench:
    name: Shim overhead
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.6'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Build nvx
        run: go build -trimpath -ldflags "-s -w" -o nvx ./cmd/nvx

      - name: Benchmark shim dispatch overhead
        run: python3 scripts/bench.py --nvx ./nvx --runs 60
