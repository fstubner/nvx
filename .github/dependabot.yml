version: 2
updates:
  # Workflow actions are pinned to commit SHAs, so nothing moves unless
  # Dependabot opens a PR that bumps the SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The docs site's npm dependencies. Without an entry here Dependabot only
  # opens security updates for them, one per advisory.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
