<?xml version="1.0" encoding="UTF-8"?>
<!-- The hexagon from assets/nvx_logo.png, reduced to what survives at 16px:
     one ring, no inner hexagon, no lettering. The gradient is the logo's own
     blue -> purple, not the brand ramp, because the mark in the nav is the
     blue one and a tab icon that disagrees with it reads as a different
     product. Arrived as netscli's green square. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="nvx">
  <defs>
    <linearGradient id="m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b9bd5"/>
      <stop offset="100%" stop-color="#c34fd0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#16161a"/>
  <path d="M32 12 L49 22 L49 42 L32 52 L15 42 L15 22 Z"
        fill="none" stroke="url(#m)" stroke-width="5" stroke-linejoin="round"/>
</svg>
